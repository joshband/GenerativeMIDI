name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  JUCE_VERSION: "8.0.15"
  PLUGINVAL_VERSION: "v1.0.4"

jobs:
  build-ios:
    name: Build iOS/iPadOS AUv3
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        submodules: recursive

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: latest-stable

    - name: Install JUCE
      run: |
        git clone --depth 1 --branch "${JUCE_VERSION}" https://github.com/juce-framework/JUCE.git JUCE

    - name: Generate Xcode Project
      run: |
        mkdir -p build_ios
        cd build_ios
        cmake .. -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_SYSROOT=iphoneos \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0

    - name: Build for iOS
      run: |
        cd build_ios
        xcodebuild -scheme GenerativeMIDI_AUv3 \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          build

    - name: Upload Artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: GenerativeMIDI-iOS
        # AUv3 product is an .appex (may also emit a host .app depending on JUCE/Xcode).
        path: |
          build_ios/**/*.appex
          build_ios/**/*.app
        if-no-files-found: error

  build-macos:
    name: Build macOS Plugins
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        submodules: recursive

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: latest-stable

    - name: Install JUCE
      run: |
        git clone --depth 1 --branch "${JUCE_VERSION}" https://github.com/juce-framework/JUCE.git JUCE

    - name: Build Plugins
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        cmake --build . --config Release

    - name: Run unit tests
      run: |
        cd build
        ctest --output-on-failure -C Release

    - name: Download pluginval
      run: |
        curl -fsSL "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip" -o pluginval.zip
        unzip -q pluginval.zip
        chmod +x pluginval.app/Contents/MacOS/pluginval

    - name: Validate VST3 with pluginval
      run: |
        VST3_PATH="build/GenerativeMIDI_artefacts/Release/VST3/Generative MIDI.vst3"
        test -d "${VST3_PATH}"
        mkdir -p pluginval-logs
        # MIDI-effect VST3: validate in-process; skip GUI (headless CI).
        # AU is not run here — see docs/developer/CI.md (auval / host registration limits).
        ./pluginval.app/Contents/MacOS/pluginval \
          --validate-in-process \
          --strictness-level 5 \
          --skip-gui-tests \
          --output-dir pluginval-logs \
          "${VST3_PATH}"

    - name: Upload pluginval logs
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: pluginval-logs-macOS
        path: pluginval-logs/
        if-no-files-found: warn

    - name: Upload Artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: GenerativeMIDI-macOS
        path: build/GenerativeMIDI_artefacts/Release/**/*
        if-no-files-found: error

  build-windows:
    name: Build Windows VST3
    # Pin windows-2022: windows-latest may be VS 2026-only, which breaks -G "Visual Studio 17 2022".
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        submodules: recursive

    # Clone into ./JUCE (no symlink). Configure/build use default pwsh so
    # CMake can discover Visual Studio — Git Bash often cannot.
    - name: Install JUCE
      shell: bash
      run: |
        git clone --depth 1 --branch "${JUCE_VERSION}" https://github.com/juce-framework/JUCE.git JUCE

    - name: Configure
      run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

    - name: Build Plugins
      run: cmake --build build --config Release

    - name: Run unit tests
      run: |
        cd build
        ctest --output-on-failure -C Release

    - name: Download pluginval
      shell: bash
      run: |
        curl -fsSL "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Windows.zip" -o pluginval.zip
        unzip -q pluginval.zip

    - name: Validate VST3 with pluginval
      shell: bash
      run: |
        VST3_PATH="build/GenerativeMIDI_artefacts/Release/VST3/Generative MIDI.vst3"
        test -d "${VST3_PATH}"
        mkdir -p pluginval-logs
        ./pluginval.exe \
          --validate-in-process \
          --strictness-level 5 \
          --skip-gui-tests \
          --output-dir pluginval-logs \
          "${VST3_PATH}"

    - name: Upload pluginval logs
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: pluginval-logs-Windows
        path: pluginval-logs/
        if-no-files-found: warn

    - name: Upload Artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: GenerativeMIDI-Windows
        path: |
          build/GenerativeMIDI_artefacts/Release/VST3/**
          build/GenerativeMIDI_artefacts/Release/Standalone/**
        if-no-files-found: error

  build-linux:
    name: Build Linux VST3
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      with:
        submodules: recursive

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          cmake \
          pkg-config \
          libasound2-dev \
          libfreetype6-dev \
          libfontconfig1-dev \
          libx11-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxext-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxrender-dev \
          libglu1-mesa-dev \
          libjack-jackd2-dev

    - name: Install JUCE
      run: |
        git clone --depth 1 --branch "${JUCE_VERSION}" https://github.com/juce-framework/JUCE.git JUCE

    - name: Configure
      run: |
        mkdir -p build
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Plugins
      run: cmake --build build --config Release -j"$(nproc)"

    - name: Run unit tests
      run: |
        cd build
        ctest --output-on-failure -C Release

    - name: Download pluginval
      run: |
        curl -fsSL "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Linux.zip" -o pluginval.zip
        unzip -q pluginval.zip
        chmod +x pluginval

    - name: Validate VST3 with pluginval
      run: |
        VST3_PATH="build/GenerativeMIDI_artefacts/Release/VST3/Generative MIDI.vst3"
        test -d "${VST3_PATH}"
        mkdir -p pluginval-logs
        # Headless Linux: no display; skip GUI tests.
        ./pluginval \
          --validate-in-process \
          --strictness-level 5 \
          --skip-gui-tests \
          --output-dir pluginval-logs \
          "${VST3_PATH}"

    - name: Upload pluginval logs
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: pluginval-logs-Linux
        path: pluginval-logs/
        if-no-files-found: warn

    - name: Upload Artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: GenerativeMIDI-Linux
        path: |
          build/GenerativeMIDI_artefacts/Release/VST3/**
          build/GenerativeMIDI_artefacts/Release/Standalone/**
        if-no-files-found: error
