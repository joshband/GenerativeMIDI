name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    # Weekly full matrix: iOS and Windows do not run on pull requests.
    - cron: "17 6 * * 1"

permissions:
  contents: read

# One run per PR/branch: a new push cancels the superseded PR run.
# Runs on main/master are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JUCE_VERSION: "8.0.15"
  PLUGINVAL_VERSION: "v1.0.4"
  # sha256 of the pluginval v1.0.4 release assets (computed from the real downloads).
  PLUGINVAL_SHA256_MACOS: "3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f"
  PLUGINVAL_SHA256_LINUX: "c01c49d8063965c4c2dea8324468336768f5c9139e0b1caebde14c2400b55352"
  PLUGINVAL_SHA256_WINDOWS: "c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab"

jobs:
  # Docs-only PRs (docs/**, *.md, LICENSE) skip the builds. Skipped jobs satisfy
  # required status checks, unlike a workflow that never starts (paths-ignore).
  # Changes under .github/workflows always count as code.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Classify changed files
      id: diff
      env:
        EVENT: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        if [ "${EVENT}" != "pull_request" ]; then
          echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        code=false
        while IFS= read -r f; do
          case "$f" in
            docs/*|*.md|LICENSE) ;;
            *) code=true; echo "code change: $f" ;;
          esac
        done < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
        echo "code=${code}" >> "$GITHUB_OUTPUT"

  build-ios:
    name: Build iOS/iPadOS AUv3
    needs: changes
    # Not on pull requests: runs on push to main/master, weekly, and manual dispatch.
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: latest-stable

    - name: Install JUCE
      run: |
        git clone --depth 1 --branch "${JUCE_VERSION}" https://github.com/juce-framework/JUCE.git JUCE

    - name: Generate Xcode Project
      run: |
        mkdir -p build_ios
        cd build_ios
        cmake .. -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_SYSROOT=iphoneos \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0

    - name: Build for iOS
      run: |
        cd build_ios
        xcodebuild -scheme GenerativeMIDI_AUv3 \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          build

    - name: Upload Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: GenerativeMIDI-iOS
        # AUv3 product is an .appex (may also emit a host .app depending on JUCE/Xcode).
        path: |
          build_ios/**/*.appex
          build_ios/**/*.app
        if-no-files-found: error
        retention-days: 14

  build-macos:
    name: Build macOS Plugins
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: latest-stable

    - name: Install JUCE
      run: |
        git clone --depth 1 --branch "${JUCE_VERSION}" https://github.com/juce-framework/JUCE.git JUCE

    - name: Install ccache
      run: brew install ccache

    # Pull requests only restore (falling back to the newest master-scope cache); saving is done
    # by the "Save ccache objects" step below on non-PR events. See docs/developer/CI.md.
    - name: Restore ccache objects
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/ccache
        key: ccache-macos-${{ github.sha }}
        restore-keys: ccache-macos-

    - name: Build Plugins
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        cmake --build . --config Release
        ccache --show-stats

    - name: Save ccache objects
      if: github.event_name != 'pull_request'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/ccache
        key: ccache-macos-${{ github.sha }}

    - name: Run unit tests
      run: |
        cd build
        ctest --output-on-failure -C Release

    - name: Restore pluginval download
      id: pluginval-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: pluginval.zip
        key: pluginval-${{ env.PLUGINVAL_VERSION }}-macOS

    - name: Download pluginval
      run: |
        [ -f pluginval.zip ] || curl -fsSL "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip" -o pluginval.zip
        echo "${PLUGINVAL_SHA256_MACOS}  pluginval.zip" | shasum -a 256 -c -
        unzip -q pluginval.zip
        chmod +x pluginval.app/Contents/MacOS/pluginval

    - name: Save pluginval download
      if: github.event_name != 'pull_request' && steps.pluginval-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: pluginval.zip
        key: pluginval-${{ env.PLUGINVAL_VERSION }}-macOS

    - name: Validate VST3 with pluginval
      run: |
        VST3_PATH="build/GenerativeMIDI_artefacts/Release/VST3/Generative MIDI.vst3"
        test -d "${VST3_PATH}"
        mkdir -p pluginval-logs
        # MIDI-effect VST3: validate in-process; skip GUI (headless CI).
        # AU is not run here — see docs/developer/CI.md (auval / host registration limits).
        ./pluginval.app/Contents/MacOS/pluginval \
          --validate-in-process \
          --strictness-level 5 \
          --skip-gui-tests \
          --output-dir pluginval-logs \
          "${VST3_PATH}"

    - name: Upload pluginval logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pluginval-logs-macOS
        path: pluginval-logs/
        if-no-files-found: warn
        retention-days: 14

    - name: Upload Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: GenerativeMIDI-macOS
        path: build/GenerativeMIDI_artefacts/Release/**/*
        if-no-files-found: error
        retention-days: 14

  build-windows:
    name: Build Windows VST3
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    # Pin windows-2022: windows-latest may be VS 2026-only, which breaks -G "Visual Studio 17 2022".
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    # Clone into ./JUCE (no symlink). Configure/build use default pwsh so
    # CMake can discover Visual Studio — Git Bash often cannot.
    - name: Install JUCE
      shell: bash
      run: |
        git clone --depth 1 --branch "${JUCE_VERSION}" https://github.com/juce-framework/JUCE.git JUCE

    - name: Configure
      run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

    - name: Build Plugins
      run: cmake --build build --config Release

    - name: Run unit tests
      run: |
        cd build
        ctest --output-on-failure -C Release

    - name: Download pluginval
      shell: bash
      run: |
        curl -fsSL "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Windows.zip" -o pluginval.zip
        echo "${PLUGINVAL_SHA256_WINDOWS}  pluginval.zip" | sha256sum -c -
        unzip -q pluginval.zip

    - name: Validate VST3 with pluginval
      shell: bash
      run: |
        VST3_PATH="build/GenerativeMIDI_artefacts/Release/VST3/Generative MIDI.vst3"
        test -d "${VST3_PATH}"
        mkdir -p pluginval-logs
        ./pluginval.exe \
          --validate-in-process \
          --strictness-level 5 \
          --skip-gui-tests \
          --output-dir pluginval-logs \
          "${VST3_PATH}"

    - name: Upload pluginval logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pluginval-logs-Windows
        path: pluginval-logs/
        if-no-files-found: warn
        retention-days: 14

    - name: Upload Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: GenerativeMIDI-Windows
        path: |
          build/GenerativeMIDI_artefacts/Release/VST3/**
          build/GenerativeMIDI_artefacts/Release/Standalone/**
        if-no-files-found: error
        retention-days: 14

  build-linux:
    name: Build Linux VST3
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          cmake \
          pkg-config \
          libasound2-dev \
          libfreetype6-dev \
          libfontconfig1-dev \
          libx11-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxext-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxrender-dev \
          libglu1-mesa-dev \
          libjack-jackd2-dev \
          ccache

    - name: Install JUCE
      run: |
        git clone --depth 1 --branch "${JUCE_VERSION}" https://github.com/juce-framework/JUCE.git JUCE

    # Pull requests only restore (falling back to the newest master-scope cache); saving is done
    # by the "Save ccache objects" step below on non-PR events. See docs/developer/CI.md.
    - name: Restore ccache objects
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-linux-${{ github.sha }}
        restore-keys: ccache-linux-

    - name: Configure
      run: |
        mkdir -p build
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build Plugins
      run: |
        cmake --build build --config Release -j"$(nproc)"
        ccache --show-stats

    - name: Save ccache objects
      if: github.event_name != 'pull_request'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-linux-${{ github.sha }}

    - name: Run unit tests
      run: |
        cd build
        ctest --output-on-failure -C Release

    - name: Download pluginval
      run: |
        curl -fsSL "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Linux.zip" -o pluginval.zip
        echo "${PLUGINVAL_SHA256_LINUX}  pluginval.zip" | sha256sum -c -
        unzip -q pluginval.zip
        chmod +x pluginval

    - name: Validate VST3 with pluginval
      run: |
        VST3_PATH="build/GenerativeMIDI_artefacts/Release/VST3/Generative MIDI.vst3"
        test -d "${VST3_PATH}"
        mkdir -p pluginval-logs
        # Headless Linux: no display; skip GUI tests.
        ./pluginval \
          --validate-in-process \
          --strictness-level 5 \
          --skip-gui-tests \
          --output-dir pluginval-logs \
          "${VST3_PATH}"

    - name: Upload pluginval logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pluginval-logs-Linux
        path: pluginval-logs/
        if-no-files-found: warn
        retention-days: 14

    - name: Upload Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: GenerativeMIDI-Linux
        path: |
          build/GenerativeMIDI_artefacts/Release/VST3/**
          build/GenerativeMIDI_artefacts/Release/Standalone/**
        if-no-files-found: error
        retention-days: 14

  sanitize-asan:
    name: Sanitizers (ASan+UBSan)
    needs: changes
    # Runs on pull requests too (see docs/developer/CI.md for measured runtime).
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          cmake \
          pkg-config \
          libasound2-dev \
          libfreetype6-dev \
          libfontconfig1-dev \
          libx11-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxext-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxrender-dev \
          libglu1-mesa-dev \
          libjack-jackd2-dev \
          ccache

    - name: Install JUCE
      run: |
        git clone --depth 1 --branch "${JUCE_VERSION}" https://github.com/juce-framework/JUCE.git JUCE

    # Pull requests only restore (falling back to the newest master-scope cache); saving is done
    # by the "Save ccache objects" step below on non-PR events. See docs/developer/CI.md.
    - name: Restore ccache objects
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-linux-asan-${{ github.sha }}
        restore-keys: ccache-linux-asan-

    - name: Configure
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
          -DGENMIDI_SANITIZE=address,undefined \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    # Only the two Catch2 executables: no VST3/Standalone wrappers are needed.
    - name: Build tests
      run: |
        cmake --build build --target GenerativeMIDITests GenerativeMIDIHostSmokeTests -j"$(nproc)"
        ccache --show-stats

    - name: Save ccache objects
      if: github.event_name != 'pull_request'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-linux-asan-${{ github.sha }}

    - name: Run unit tests
      env:
        ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:detect_stack_use_after_return=1
        UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      run: |
        cd build
        ctest --output-on-failure

  sanitize-tsan:
    name: Sanitizers (TSan)
    needs: changes
    # Not on pull requests: push to main/master, weekly, and manual dispatch.
    if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # NON-REQUIRED / advisory: continue-on-error keeps a TSan finding from failing the run.
    # TSan legitimately flags the Polyrhythm data race until fix/polyrhythm-thread-safety
    # lands. Once it does, remove the next line (and consider requiring this check).
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          cmake \
          pkg-config \
          libasound2-dev \
          libfreetype6-dev \
          libfontconfig1-dev \
          libx11-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxext-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxrender-dev \
          libglu1-mesa-dev \
          libjack-jackd2-dev \
          ccache

    - name: Install JUCE
      run: |
        git clone --depth 1 --branch "${JUCE_VERSION}" https://github.com/juce-framework/JUCE.git JUCE

    # Pull requests only restore (falling back to the newest master-scope cache); saving is done
    # by the "Save ccache objects" step below on non-PR events. See docs/developer/CI.md.
    - name: Restore ccache objects
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-linux-tsan-${{ github.sha }}
        restore-keys: ccache-linux-tsan-

    # Newer runner kernels use high ASLR entropy that breaks TSan's shadow memory mapping.
    - name: Lower ASLR entropy for TSan
      run: sudo sysctl vm.mmap_rnd_bits=28

    - name: Configure
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
          -DGENMIDI_SANITIZE=thread \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    # Only the two Catch2 executables: no VST3/Standalone wrappers are needed.
    - name: Build tests
      run: |
        cmake --build build --target GenerativeMIDITests GenerativeMIDIHostSmokeTests -j"$(nproc)"
        ccache --show-stats

    - name: Save ccache objects
      if: github.event_name != 'pull_request'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-linux-tsan-${{ github.sha }}

    - name: Run unit tests
      env:
        # libtsan (GCC 11) reports false positives entirely inside JUCE (Timer::TimerThread /
        # WaitableEvent): "double lock of a mutex" (report_mutex_bugs=0) and lock-order-inversion
        # (filtered below; TSan suppressions did not match these). exitcode=0 so those reports
        # do not fail the test; the step instead fails on any other TSan report, e.g. data races.
        TSAN_OPTIONS: report_mutex_bugs=0:exitcode=0
      run: |
        cd build
        set -o pipefail
        ctest --output-on-failure -V 2>&1 | tee ctest-tsan.log
        if grep "WARNING: ThreadSanitizer" ctest-tsan.log | grep -v "lock-order-inversion"; then
          echo "::error::ThreadSanitizer reported a data race or other issue (see log above)"
          exit 1
        fi
