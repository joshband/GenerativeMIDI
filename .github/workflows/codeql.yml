name: CodeQL

on:
  push:
    branches: [ main, master ]
  # No base-branch filter: stacked PRs also get the (cheap) actions scan.
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 3"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JUCE_VERSION: "8.0.15"

jobs:
  # The c-cpp scan needs a full uncached build (~15 min), so on pull requests it only runs with the
  # full-ci label or when build/CI files change. Always on push to master, weekly and manual runs.
  # The actions scan is cheap and runs everywhere. The matrix is built by the scope job, so no c-cpp check is created when it is not needed.
  scope:
    name: CodeQL scope
    # Draft PRs run nothing (saves runner minutes while iterating); marking ready runs CI.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.diff.outputs.matrix }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Decide whether to scan c-cpp
      id: diff
      env:
        EVENT: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        FULL_CI_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
      run: |
        cpp=false
        if [ "${EVENT}" != "pull_request" ] || [ "${FULL_CI_LABEL}" = "true" ]; then
          cpp=true
        else
          while IFS= read -r f; do
            case "$f" in
              CMakeLists.txt|*/CMakeLists.txt|cmake/*|*.cmake|.github/*|.gitmodules)
                cpp=true; echo "build change: $f" ;;
            esac
          done < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
        fi
        actions='{"language":"actions","build-mode":"none"}'
        cppjob='{"language":"c-cpp","build-mode":"manual"}'
        if [ "${cpp}" = "true" ]; then
          echo "matrix={\"include\":[${cppjob},${actions}]}" >> "$GITHUB_OUTPUT"
        else
          echo "matrix={\"include\":[${actions}]}" >> "$GITHUB_OUTPUT"
        fi

  analyze:
    name: CodeQL (${{ matrix.language }})
    needs: scope
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Initialize CodeQL
      uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        config-file: ./.github/codeql/codeql-config.yml

    - name: Install build dependencies
      if: matrix.build-mode == 'manual'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          cmake \
          pkg-config \
          libasound2-dev \
          libfreetype6-dev \
          libfontconfig1-dev \
          libx11-dev \
          libxcomposite-dev \
          libxcursor-dev \
          libxext-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxrender-dev \
          libglu1-mesa-dev \
          libjack-jackd2-dev

    - name: Install JUCE
      if: matrix.build-mode == 'manual'
      run: |
        git clone --depth 1 --branch "${JUCE_VERSION}" https://github.com/juce-framework/JUCE.git JUCE

    # No ccache here: a cache hit skips the compiler and CodeQL would extract nothing.
    # Both targets: building GenerativeMIDI alone was measured slower (1107 s and 1025 s vs 884 s), so the
    # test executables stay in (JUCE modules dominate the build). No format wrappers.
    - name: Build
      if: matrix.build-mode == 'manual'
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --target GenerativeMIDI GenerativeMIDITests -j"$(nproc)"

    - name: Perform CodeQL analysis
      uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        category: "/language:${{ matrix.language }}"
